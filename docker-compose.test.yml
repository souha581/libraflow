services:
  postgres-test:
    image: postgres:16-alpine
    container_name: libraflow-postgres-test
    environment:
      POSTGRES_DB: ${DB_NAME:-libraflow_test}
      POSTGRES_USER: ${DB_USER:-libraflow_test}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - libraflow_test_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-libraflow_test} -d ${DB_NAME:-libraflow_test}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - libraflow-test-net

  app-test:
    image: ${LIBRAFLOW_IMAGE:?LIBRAFLOW_IMAGE must be set}
    container_name: libraflow-app-test
    restart: unless-stopped
    depends_on:
      postgres-test:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: test
      APP_VERSION: ${APP_VERSION:-1.0.0}
      DB_HOST: postgres-test
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-libraflow_test}
      DB_USER: ${DB_USER:-libraflow_test}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-true}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-admin}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
      APP_MEMBER_USERNAME: ${APP_MEMBER_USERNAME:-etudiant}
      APP_MEMBER_PASSWORD: ${APP_MEMBER_PASSWORD:-}
    ports:
      - "${TEST_SERVER_PORT:-8081}:8080"
    volumes:
      - libraflow_test_logs:/app/logs
    networks:
      - libraflow-test-net

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: libraflow-prometheus-test
    restart: unless-stopped
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - app-test
    networks:
      - libraflow-test-net

volumes:
  libraflow_test_pgdata:
  libraflow_test_logs:

networks:
  libraflow-test-net:
    driver: bridge
