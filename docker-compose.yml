services:
  postgres:
    image: postgres:16-alpine
    container_name: libraflow-postgres-dev
    environment:
      POSTGRES_DB: ${DB_NAME:-libraflow_dev}
      POSTGRES_USER: ${DB_USER:-libraflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    ports:
      - "5432:5432"
    volumes:
      - libraflow_dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-libraflow} -d ${DB_NAME:-libraflow_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - libraflow-dev-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: libraflow-app-dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      APP_VERSION: ${APP_VERSION:-1.0.0-dev}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-libraflow_dev}
      DB_USER: ${DB_USER:-libraflow}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-true}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-admin}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
      APP_MEMBER_USERNAME: ${APP_MEMBER_USERNAME:-etudiant}
      APP_MEMBER_PASSWORD: ${APP_MEMBER_PASSWORD:-}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - ./logs:/app/logs
    networks:
      - libraflow-dev-net

volumes:
  libraflow_dev_pgdata:

networks:
  libraflow-dev-net:
    driver: bridge
