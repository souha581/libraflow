spring:
  application:
    name: libraflow
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
  thymeleaf:
    cache: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: LibraFlow
    description: Application de gestion de bibliotheque
    version: ${APP_VERSION:1.0.0}
    environment: ${SPRING_PROFILES_ACTIVE:default}

logging:
  level:
    root: INFO
    com.libraflow: ${APP_LOG_LEVEL:INFO}
  file:
    name: ${LOG_FILE_PATH:logs/libraflow.log}

app:
  seed:
    enabled: ${APP_SEED_ENABLED:false}
    admin-username: ${APP_ADMIN_USERNAME:admin}
    admin-password: ${APP_ADMIN_PASSWORD:}
    member-username: ${APP_MEMBER_USERNAME:etudiant}
    member-password: ${APP_MEMBER_PASSWORD:}
