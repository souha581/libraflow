name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  quality-and-build:
    name: Build, Lint, Static Analysis & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 with Maven cache
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Compute short SHA and version
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "artifact_version=1.0.0-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Checkstyle formatting & lint
        run: mvn -B checkstyle:check

      - name: Run unit & integration tests, SpotBugs, JaCoCo gate & package
        run: mvn -B verify -Dspring.profiles.active=ci

      - name: Archive test, coverage & static analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-and-test-reports-${{ steps.meta.outputs.short_sha }}
          path: |
            target/surefire-reports/
            target/site/jacoco/
            target/spotbugsXml.xml
          retention-days: 14

      - name: Archive versioned JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: libraflow-jar-${{ steps.meta.outputs.artifact_version }}
          path: target/libraflow-*.jar
          retention-days: 14

  security-scan:
    name: DevSecOps (Secrets & Dependencies)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret detection with Gitleaks
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:v8.21.2 detect --source="/repo" --verbose --redact

      - name: Dependency & filesystem vulnerability scan with Trivy
        uses: aquasecurity/trivy-action@0.29.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          output: "trivy-fs-report.txt"
          severity: "CRITICAL,HIGH,MEDIUM"
          exit-code: "0"

      - name: Archive Trivy filesystem report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-report
          path: trivy-fs-report.txt
          retention-days: 14

  container-build-and-publish:
    name: Docker Build, Image Scan & GHCR Publish
    needs: [quality-and-build, security-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Docker metadata & explicit tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image (local load for Trivy scan)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:scan-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: "${{ env.IMAGE_NAME }}:scan-${{ github.sha }}"
          format: "table"
          output: "trivy-image-report.txt"
          severity: "CRITICAL,HIGH"
          exit-code: "0"

      - name: Archive Trivy container image report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-report
          path: trivy-image-report.txt
          retention-days: 14

      - name: Push tagged image to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
